<!doctype html><html><head><meta charset="utf-8"><script src="support.js"></script></head><body><x-dc><helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Instrument+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff}
  body{font-family:'Instrument Sans',system-ui,sans-serif;color:#14120F;-webkit-font-smoothing:antialiased}
  a{color:var(--acc-ink);text-decoration:none}
  a:hover{color:var(--acc)}
  @keyframes driftSlow{0%,100%{transform:translate(0,0)}50%{transform:translate(-18px,-22px)}}
  @keyframes driftSlow2{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(16px,-14px) rotate(4deg)}}
</style>
</helmet>

<div style="--acc:#1B3FE3;--on-acc:#fff;--tint:#EDF1FF;--acc-ink:#1B3FE3;--acc-soft:#C9D5FF;position:relative;min-height:760px;overflow:hidden;background:#fff;padding:36px 40px 48px">
  <div style="position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;right:-140px;top:-120px;width:460px;height:460px;border-radius:999px;background:#EDF1FF;animation:driftSlow 24s ease-in-out infinite"></div>
    <div style="position:absolute;left:-120px;bottom:-160px;width:400px;height:400px;border-radius:999px;background:#FAF8F4;animation:driftSlow2 28s ease-in-out infinite"></div>
    <div style="position:absolute;right:220px;bottom:60px;width:170px;height:170px;border-radius:999px;border:1.5px solid #C9D5FF;opacity:.7;animation:driftSlow2 20s ease-in-out infinite"></div>
    <div style="position:absolute;left:46%;top:-60px;width:120px;height:120px;border-radius:999px;border:1.5px solid #C9D5FF;opacity:.6"></div>
  </div>
  <div style="position:relative;z-index:1;max-width:900px">
    <span style="display:inline-flex;background:#14120F;color:#fff;border-radius:999px;padding:8px 16px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase">D · Soft blobs + rings</span>
    <p style="margin:30px 0 12px;font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-ink)">Thursday, 11 September</p>

    <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:28px">
      <button style="background:var(--acc);color:#fff;border:none;border-radius:15px;padding:16px 26px;font-size:16.5px;font-weight:700;min-height:52px;cursor:pointer">Meet someone</button>
      <button style="background:#fff;border:1.5px solid #E3DED5;border-radius:15px;padding:16px 26px;font-size:16.5px;font-weight:700;min-height:52px;cursor:pointer">Explore Radix</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:40px">
      <article style="background:#fff;border:1px solid #ECE8E1;border-radius:26px;padding:26px;box-shadow:0 1px 2px rgba(20,18,15,.03)">
        <p style="margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#9A948A">You two should meet</p>
        <h3 style="margin:0;font-family:'Bricolage Grotesque',serif;font-size:24px;font-weight:700;letter-spacing:-.02em">Mateus Tavares</h3>
        <p style="margin:6px 0 0;font-size:15.5px;color:#6E6A62">Engineering · São Paulo</p>
      </article>
      <article style="background:#FAF8F4;border:1px solid #F1EDE6;border-radius:26px;padding:26px">
        <h3 style="margin:0;font-family:'Bricolage Grotesque',serif;font-size:24px;font-weight:700;letter-spacing:-.02em">Want to learn something?</h3>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:16px">
          <span style="background:#fff;border:1.5px solid #EBE6DE;border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:600">Leadership</span>
          <span style="background:#fff;border:1.5px solid #EBE6DE;border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:600">Python</span>
          <span style="background:#fff;border:1.5px solid #EBE6DE;border-radius:999px;padding:10px 16px;font-size:14.5px;font-weight:600">Running</span>
        </div>
      </article>
    </div>
  </div>
</div>
</x-dc></body></html>
